services:
  seekdb:
    image: quay.io/oceanbase/seekdb:latest
    container_name: multi-lang-seekdb
    ports:
      - "2881:2881"
    environment:
      ROOT_PASSWORD: ${SEEKDB_ROOT_PASSWORD:?set SEEKDB_ROOT_PASSWORD in .env}
    volumes:
      - seekdb-data:/var/lib/oceanbase
    healthcheck:
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-P", "2881", "-u", "root", "-p${SEEKDB_ROOT_PASSWORD}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 180s

volumes:
  seekdb-data:
